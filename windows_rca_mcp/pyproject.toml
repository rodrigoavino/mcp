[project]
name = "windows-rca-mcp"
version = "0.2.0"
description = "MCP (FastMCP) de OPS para Windows Server via WinRM: eventos, disco, performance, servicos, patches, CBS, rede e saude."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.2.2",
    "pywinrm>=0.5.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
windows-rca-mcp = "windows_rca_mcp:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
